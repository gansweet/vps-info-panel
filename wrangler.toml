name = "vps-info-panel"
main = "worker.js"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "vps-info-db"
database_id = "00000000-0000-0000-0000-000000000000"   # 部署到 Cloudflare 时换成真实 ID（本地/Docker 可不改）

[triggers]
crons = ["* * * * *"]   # 每分钟：离线/负载/到期判断 + 网站检测

# [vars]
# GITHUB_REPO = "你的用户名/仓库名"   # 可选：也可在后台「系统设置」填写 GitHub 仓库地址
# 密钥类变量请用：npx wrangler secret put JWT_SECRET  /  ADMIN_PASSWORD  /  METRICS_TOKEN
