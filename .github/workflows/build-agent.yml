name: build-agent
on:
  push: { tags: ['v*'] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  linux:
    strategy:
      matrix:
        include: [{ os: ubuntu-latest, arch: amd64 }, { os: ubuntu-24.04-arm, arch: arm64 }]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: 静态编译（Alpine/musl）
        run: |
          mkdir -p dist
          docker run --rm -v "$PWD":/w -w /w alpine:3.20 sh -c '
            apk add --no-cache build-base pkgconf curl-dev curl-static openssl-libs-static zlib-static nghttp2-static brotli-static c-ares-static libidn2-static libunistring-static zstd-static &&
            gcc -O2 -static -o dist/vpsagent-linux-${{ matrix.arch }} agent/vpsagent.c $(pkg-config --static --cflags --libs libcurl)'
      - uses: actions/upload-artifact@v4
        with: { name: linux-${{ matrix.arch }}, path: dist/* }
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p dist
          cc -O2 -arch arm64  -o dist/vpsagent-darwin-arm64 agent/vpsagent.c -lcurl
          cc -O2 -arch x86_64 -o dist/vpsagent-darwin-amd64 agent/vpsagent.c -lcurl
      - uses: actions/upload-artifact@v4
        with: { name: darwin, path: dist/* }
  release:
    needs: [linux, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: dist/*, generate_release_notes: true }
